
<table class="table">
    <thead class="table-dark">
        <tr>
            <th></th>
            <th>
               Name 
            </th>
            <th>Price</th>
            <th>Units in Stock</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor= "let tempProduct of products">
            <td class="align-middle"></td>
            <td><img src="{{tempProduct.imageUrl}}" height="50"></td>
        <td class="align-middle">
             {{ tempProduct.name }}
        </td>
        <td class="align-middle">{{ tempProduct.unit_price | currency: 'USD' }}</td>
        <td class="align-middle">{{ tempProduct.UnitsInStock }}</td>
        </tr>

    </tbody>
</table>
